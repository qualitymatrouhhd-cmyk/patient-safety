<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليل سلامة المرضى الذكي بمطروح</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1b2a !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 32, 39, 0.85), rgba(32, 58, 67, 0.9)), 
                        url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed !important;
            background-size: cover !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 95%;
            max-width: 1100px;
            height: 88vh;
            background: rgba(15, 25, 35, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: transparent;
        }

        /* شاشة الترحيب الجذابة التي تملأ الشاشة ثم تختفي */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 27, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            pointer-events: none; /* تمنع حجب الضغطات بعد اختفائها */
            
            /* أنيميشن: تظهر بتكبير، تثبت، ثم تصغر وتختفي */
            animation: splashAnim 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .splash-logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0, 212, 255, 0.4));
        }

        .splash-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #80d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 15px;
            line-height: 1.4;
        }

        /* كود حركة الشاشة السينمائية */
        @keyframes splashAnim {
            0% {
                opacity: 0;
                transform: scale(1.2);
            }
            20% {
                opacity: 1;
                transform: scale(1);
            }
            75% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.7);
                visibility: hidden;
            }
        }

        @media (max-width: 768px) {
            body { padding: 8px; }
            .chat-container {
                height: 94vh;
                border-radius: 18px;
            }
            .splash-logo {
                width: 100px;
                height: 100px;
            }
            .splash-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <iframe id="chat-frame" src="https://cdn.botpress.cloud/webchat/v5.0/shareable.html?configUrl=https://files.bpcontent.cloud/2026/08/10/07/20260810075954-0R4V3S8O.json"></iframe>
    </div>

    <!-- واجهة الترحيب السينمائية -->
    <div id="splash-screen">
        <img class="splash-logo" src="logo.png" alt="لوجو المساعد">
        <div class="splash-title">دليل سلامة المرضى الذكي بمطروح 🩺</div>
    </div>

</body>
</html>
